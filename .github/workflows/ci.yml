name: Rust CI

on:
  push:
    branches: [main, "feat/**", "docs/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, tests and docs (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Compile optional matrix backend benchmark
        run: cargo bench -p jabr-table-core --bench matrix_backend_compare --features backend-bench --no-run
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum supported Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets
