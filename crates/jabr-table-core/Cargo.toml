[package]
name = "jabr-table-core"
version = "0.1.0"
description = "Typed table data model and operations for the Jabr engineering ecosystem"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
csv.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
faer = { version = "0.24.4", default-features = false, features = ["std"], optional = true }
nalgebra = { version = "0.33.3", optional = true }

[features]
default = []
backend-bench = ["dep:faer", "dep:nalgebra"]

[[bench]]
name = "matrix_backend_compare"
harness = false
required-features = ["backend-bench"]
